name: Delegation Flow

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  delegation-flow-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      DELEGATION_SCREENSHOT_MODE: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Delegation Flow E2E (Worker Fallback)
        run: npx playwright test tests/delegation-upload-flow.spec.ts --project=chromium --retries=2 --workers=1 --grep "Worker Fallback \(Forced\)"

      - name: Upload delegation flow screenshots (worker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegation-flow-screenshots-worker
          path: web/test-results/delegation-flow-screenshots/worker
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-worker
          path: web/test-results/
          retention-days: 7

  delegation-flow-hardware-ed25519:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      DELEGATION_SCREENSHOT_MODE: hardware-ed25519
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Delegation Flow E2E (Hardware Ed25519)
        run: npx playwright test tests/delegation-upload-flow.spec.ts --project=chromium --retries=2 --workers=1 --grep "Hardware Ed25519"

      - name: Upload delegation flow screenshots (hardware-ed25519)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegation-flow-screenshots-hardware-ed25519
          path: web/test-results/delegation-flow-screenshots/hardware-ed25519
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hardware-ed25519
          path: web/test-results/
          retention-days: 7

  delegation-flow-hardware-p256:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      TEST_HARDWARE_P256: '1'
      DELEGATION_SCREENSHOT_MODE: hardware-p256
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Delegation Flow E2E (Hardware P-256)
        run: npx playwright test tests/delegation-upload-flow.spec.ts --project=chromium --retries=2 --workers=1 --grep "Hardware P-256 \(Fallback\)"

      - name: Upload delegation flow screenshots (hardware-p256)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegation-flow-screenshots-hardware-p256
          path: web/test-results/delegation-flow-screenshots/hardware-p256
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hardware-p256
          path: web/test-results/
          retention-days: 7

  delegation-flow-alice-bob:
    runs-on: ubuntu-latest
    env:
      ALICE_STORACHA_KEY: ${{ secrets.ALICE_STORACHA_KEY }}
      ALICE_STORACHA_PROOF: ${{ secrets.ALICE_STORACHA_PROOF }}
      ALICE_STORACHA_SPACE_DID: ${{ secrets.ALICE_STORACHA_SPACE_DID }}
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Alice/Bob archived E2E suite
        run: PLAYWRIGHT_BASE_URL=http://localhost:4173 npx playwright test tests/alice-bob-delegation.spec.ts --project=chromium --retries=2 --workers=1 --grep-invert "Authenticate with Biometric and receive DIDs"

      - name: Upload Alice/Bob test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-alice-bob
          path: web/test-results/
          retention-days: 7

  basic-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Basic UI E2E suite
        run: PLAYWRIGHT_BASE_URL=http://localhost:4173 npx playwright test tests/basic-ui.spec.ts --project=chromium --retries=2 --workers=1 --grep-invert "should create a DID successfully"

      - name: Upload Basic UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-basic-ui
          path: web/test-results/
          retention-days: 7

  hardware-mode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Hardware Mode E2E suite
        run: PLAYWRIGHT_BASE_URL=http://localhost:4173 npx playwright test tests/hardware-mode.spec.ts --project=chromium --retries=2 --workers=1 --grep-invert "falls back to worker mode when hardware init is disabled"

      - name: Upload Hardware Mode test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hardware-mode
          path: web/test-results/
          retention-days: 7

  build-delegation-flow-pages:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - delegation-flow-worker
      - delegation-flow-hardware-ed25519
      - delegation-flow-hardware-p256
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download screenshot artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: delegation-flow-screenshots-*
          path: screenshots

      - name: Build GitHub Pages site
        run: |
          set -euo pipefail
          mkdir -p site/delegation-flow/assets/worker site/delegation-flow/assets/hardware-ed25519 site/delegation-flow/assets/hardware-p256
          shopt -s nullglob
          cp screenshots/delegation-flow-screenshots-worker/*.png site/delegation-flow/assets/worker/ || true
          cp screenshots/delegation-flow-screenshots-hardware-ed25519/*.png site/delegation-flow/assets/hardware-ed25519/ || true
          cp screenshots/delegation-flow-screenshots-hardware-p256/*.png site/delegation-flow/assets/hardware-p256/ || true

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>UCAN Upload Wall CI Screenshots</title>
            <style>
              body { font-family: sans-serif; margin: 24px; background: #f8fafc; color: #111827; }
              h1 { margin-bottom: 8px; }
              .cards { display: grid; gap: 12px; max-width: 680px; margin-top: 20px; }
              a.card { display: block; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; color: #0f172a; text-decoration: none; font-weight: 600; }
              a.card:hover { border-color: #94a3b8; background: #f8fafc; }
              p.sub { color: #475569; margin: 0; font-weight: 400; font-size: 14px; }
            </style>
          </head>
          <body>
            <h1>UCAN Upload Wall CI Screenshots</h1>
            <p>Select a flow:</p>
            <div class="cards">
              <a class="card" href="./delegation-flow/">
                Delegation Flow
                <p class="sub">Worker, Hardware Ed25519, Hardware P-256</p>
              </a>
              <a class="card" href="./ipfs-network-flow/">
                IPFS Network Flow
                <p class="sub">Two-browser IPFS verification screenshots</p>
              </a>
            </div>
          </body>
          </html>
          HTML

          cat > site/delegation-flow/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Delegation Flow Screenshots</title>
            <style>
              body { font-family: sans-serif; margin: 24px; background: #f8fafc; color: #111827; }
              h1 { margin-bottom: 8px; }
              h2 { margin-top: 32px; }
              .step { margin: 18px 0 28px; }
              .label { font-weight: 600; margin-bottom: 8px; }
              img { width: 100%; max-width: 1200px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
              code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; }
              a.top { display: inline-block; margin-bottom: 14px; }
            </style>
          </head>
          <body>
            <a class="top" href="../">← Back to all flows</a>
            <h1>Delegation Flow Screenshots</h1>
            <p>Fixed filenames per mode and step.</p>

            <h2>Worker</h2>
            <div class="step"><div class="label"><code>step-01-did-created-upload-tab.png</code></div><img src="assets/worker/step-01-did-created-upload-tab.png" alt="Worker Step 1" /></div>
            <div class="step"><div class="label"><code>step-02-delegations-did-visible.png</code></div><img src="assets/worker/step-02-delegations-did-visible.png" alt="Worker Step 2" /></div>
            <div class="step"><div class="label"><code>step-03-import-form-open.png</code></div><img src="assets/worker/step-03-import-form-open.png" alt="Worker Step 3" /></div>
            <div class="step"><div class="label"><code>step-04-delegation-imported.png</code></div><img src="assets/worker/step-04-delegation-imported.png" alt="Worker Step 4" /></div>
            <div class="step"><div class="label"><code>step-05-upload-complete.png</code></div><img src="assets/worker/step-05-upload-complete.png" alt="Worker Step 5" /></div>
            <div class="step"><div class="label"><code>step-06-file-preview-open.png</code></div><img src="assets/worker/step-06-file-preview-open.png" alt="Worker Step 6" /></div>
            <div class="step"><div class="label"><code>step-07-flow-complete.png</code></div><img src="assets/worker/step-07-flow-complete.png" alt="Worker Step 7" /></div>

            <h2>Hardware Ed25519</h2>
            <div class="step"><div class="label"><code>step-01-did-created-upload-tab.png</code></div><img src="assets/hardware-ed25519/step-01-did-created-upload-tab.png" alt="Hardware Ed25519 Step 1" /></div>
            <div class="step"><div class="label"><code>step-02-delegations-did-visible.png</code></div><img src="assets/hardware-ed25519/step-02-delegations-did-visible.png" alt="Hardware Ed25519 Step 2" /></div>
            <div class="step"><div class="label"><code>step-03-import-form-open.png</code></div><img src="assets/hardware-ed25519/step-03-import-form-open.png" alt="Hardware Ed25519 Step 3" /></div>
            <div class="step"><div class="label"><code>step-04-delegation-imported.png</code></div><img src="assets/hardware-ed25519/step-04-delegation-imported.png" alt="Hardware Ed25519 Step 4" /></div>
            <div class="step"><div class="label"><code>step-05-upload-complete.png</code></div><img src="assets/hardware-ed25519/step-05-upload-complete.png" alt="Hardware Ed25519 Step 5" /></div>
            <div class="step"><div class="label"><code>step-06-file-preview-open.png</code></div><img src="assets/hardware-ed25519/step-06-file-preview-open.png" alt="Hardware Ed25519 Step 6" /></div>
            <div class="step"><div class="label"><code>step-07-flow-complete.png</code></div><img src="assets/hardware-ed25519/step-07-flow-complete.png" alt="Hardware Ed25519 Step 7" /></div>

            <h2>Hardware P-256</h2>
            <div class="step"><div class="label"><code>step-01-did-created-upload-tab.png</code></div><img src="assets/hardware-p256/step-01-did-created-upload-tab.png" alt="Hardware P-256 Step 1" /></div>
            <div class="step"><div class="label"><code>step-02-delegations-did-visible.png</code></div><img src="assets/hardware-p256/step-02-delegations-did-visible.png" alt="Hardware P-256 Step 2" /></div>
            <div class="step"><div class="label"><code>step-03-import-form-open.png</code></div><img src="assets/hardware-p256/step-03-import-form-open.png" alt="Hardware P-256 Step 3" /></div>
            <div class="step"><div class="label"><code>step-04-delegation-imported.png</code></div><img src="assets/hardware-p256/step-04-delegation-imported.png" alt="Hardware P-256 Step 4" /></div>
            <div class="step"><div class="label"><code>step-05-upload-complete.png</code></div><img src="assets/hardware-p256/step-05-upload-complete.png" alt="Hardware P-256 Step 5" /></div>
            <div class="step"><div class="label"><code>step-06-file-preview-open.png</code></div><img src="assets/hardware-p256/step-06-file-preview-open.png" alt="Hardware P-256 Step 6" /></div>
            <div class="step"><div class="label"><code>step-07-flow-complete.png</code></div><img src="assets/hardware-p256/step-07-flow-complete.png" alt="Hardware P-256 Step 7" /></div>
          </body>
          </html>
          HTML

          # Keep ipfs path reachable even if this workflow is the latest deploy.
          mkdir -p site/ipfs-network-flow
          cat > site/ipfs-network-flow/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>IPFS Network Flow</title>
          </head>
          <body style="font-family:sans-serif;margin:24px;background:#f8fafc;color:#111827;">
            <a href="../">← Back to all flows</a>
            <h1>IPFS Network Flow</h1>
            <p>This page is generated by the IPFS workflow deployment.</p>
            <p>Workflow: <a href="https://github.com/NiKrause/ucan-upload-wall/actions/workflows/ipfs-network-flow.yml">IPFS Network Flow</a></p>
          </body>
          </html>
          HTML

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: delegation-flow-pages
          path: site

  deploy-delegation-flow-pages:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: build-delegation-flow-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: delegation-flow-pages
