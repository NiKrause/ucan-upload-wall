name: IPFS Network Flow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ipfs-network-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      TEST_FORCE_WORKER: '1'
      IPFS_SCREENSHOT_MODE: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run IPFS Network Verification (Worker Fallback)
        run: npx playwright test tests/ipfs-network-verification.spec.ts --project=chromium --retries=2 --workers=1 --grep "Worker Fallback \(Forced\)"

      - name: Upload IPFS screenshots (worker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipfs-network-screenshots-worker
          path: web/test-results/ipfs-network-flow/worker
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results (worker)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ipfs-worker
          path: web/test-results/
          retention-days: 7

  ipfs-network-hardware-ed25519:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      IPFS_SCREENSHOT_MODE: hardware-ed25519
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run IPFS Network Verification (Hardware Ed25519)
        run: npx playwright test tests/ipfs-network-verification.spec.ts --project=chromium --retries=2 --workers=1 --grep "Hardware Ed25519"

      - name: Upload IPFS screenshots (hardware-ed25519)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipfs-network-screenshots-hardware-ed25519
          path: web/test-results/ipfs-network-flow/hardware-ed25519
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results (hardware-ed25519)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ipfs-hardware-ed25519
          path: web/test-results/
          retention-days: 7

  ipfs-network-hardware-p256:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      TEST_HARDWARE_P256: '1'
      IPFS_SCREENSHOT_MODE: hardware-p256
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run IPFS Network Verification (Hardware P-256)
        run: npx playwright test tests/ipfs-network-verification.spec.ts --project=chromium --retries=2 --workers=1 --grep "Hardware P-256 \(Fallback\)"

      - name: Upload IPFS screenshots (hardware-p256)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipfs-network-screenshots-hardware-p256
          path: web/test-results/ipfs-network-flow/hardware-p256
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results (hardware-p256)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ipfs-hardware-p256
          path: web/test-results/
          retention-days: 7

  publish-ipfs-network-artifacts:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'push' &&
        always() &&
        (
          needs.ipfs-network-worker.result == 'success' ||
          needs.ipfs-network-hardware-ed25519.result == 'success' ||
          needs.ipfs-network-hardware-p256.result == 'success'
        )
      }}
    needs:
      - ipfs-network-worker
      - ipfs-network-hardware-ed25519
      - ipfs-network-hardware-p256
    steps:
      - name: Download screenshot artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipfs-network-screenshots-*
          path: screenshots

      - name: Build static bundle (ipfs-network-flow directory)
        run: |
          set -euo pipefail
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>UCAN Upload Wall CI Screenshots</title>
            <style>
              body { font-family: sans-serif; margin: 24px; background: #f8fafc; color: #111827; }
              h1 { margin-bottom: 8px; }
              .cards { display: grid; gap: 12px; max-width: 680px; margin-top: 20px; }
              a.card { display: block; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; color: #0f172a; text-decoration: none; font-weight: 600; }
              a.card:hover { border-color: #94a3b8; background: #f8fafc; }
              p.sub { color: #475569; margin: 0; font-weight: 400; font-size: 14px; }
            </style>
          </head>
          <body>
            <h1>UCAN Upload Wall CI Screenshots</h1>
            <p>Select a flow:</p>
            <div class="cards">
              <a class="card" href="./delegation-flow/">
                Delegation Flow
                <p class="sub">Worker, Hardware Ed25519, Hardware P-256</p>
              </a>
              <a class="card" href="./ipfs-network-flow/">
                IPFS Network Flow
                <p class="sub">Two-browser IPFS verification screenshots</p>
              </a>
            </div>
          </body>
          </html>
          HTML

          mkdir -p site/ipfs-network-flow/assets/worker
          mkdir -p site/ipfs-network-flow/assets/hardware-ed25519
          mkdir -p site/ipfs-network-flow/assets/hardware-p256

          cp screenshots/ipfs-network-screenshots-worker/*.png site/ipfs-network-flow/assets/worker/ || true
          cp screenshots/ipfs-network-screenshots-hardware-ed25519/*.png site/ipfs-network-flow/assets/hardware-ed25519/ || true
          cp screenshots/ipfs-network-screenshots-hardware-p256/*.png site/ipfs-network-flow/assets/hardware-p256/ || true

          cat > site/ipfs-network-flow/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>IPFS Network Flow Screenshots</title>
            <style>
              body { font-family: sans-serif; margin: 24px; background: #f8fafc; color: #111827; }
              h1 { margin-bottom: 8px; }
              h2 { margin-top: 32px; }
              .step { margin: 18px 0 28px; }
              .label { font-weight: 600; margin-bottom: 8px; }
              img { width: 100%; max-width: 1280px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
              code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; }
              a.top { display: inline-block; margin-bottom: 14px; }
            </style>
          </head>
          <body>
            <a class="top" href="../">← Back to all flows</a>
            <h1>IPFS Network Flow Screenshots</h1>
            <p>Artifacts are published under <code>ipfs-network-flow/</code>.</p>

            <h2>Worker</h2>
            <div class="step"><div class="label"><code>step-01-browser-a-did-created.png</code></div><img src="assets/worker/step-01-browser-a-did-created.png" alt="Worker Step 1" /></div>
            <div class="step"><div class="label"><code>step-02-browser-a-delegation-imported.png</code></div><img src="assets/worker/step-02-browser-a-delegation-imported.png" alt="Worker Step 2" /></div>
            <div class="step"><div class="label"><code>step-03-browser-a-upload-complete.png</code></div><img src="assets/worker/step-03-browser-a-upload-complete.png" alt="Worker Step 3" /></div>
            <div class="step"><div class="label"><code>step-04-browser-a-cid-visible.png</code></div><img src="assets/worker/step-04-browser-a-cid-visible.png" alt="Worker Step 4" /></div>
            <div class="step"><div class="label"><code>step-05-browser-b-ipfs-download-success.png</code></div><img src="assets/worker/step-05-browser-b-ipfs-download-success.png" alt="Worker Step 5" /></div>

            <h2>Hardware Ed25519</h2>
            <div class="step"><div class="label"><code>step-01-browser-a-did-created.png</code></div><img src="assets/hardware-ed25519/step-01-browser-a-did-created.png" alt="Hardware Ed25519 Step 1" /></div>
            <div class="step"><div class="label"><code>step-02-browser-a-delegation-imported.png</code></div><img src="assets/hardware-ed25519/step-02-browser-a-delegation-imported.png" alt="Hardware Ed25519 Step 2" /></div>
            <div class="step"><div class="label"><code>step-03-browser-a-upload-complete.png</code></div><img src="assets/hardware-ed25519/step-03-browser-a-upload-complete.png" alt="Hardware Ed25519 Step 3" /></div>
            <div class="step"><div class="label"><code>step-04-browser-a-cid-visible.png</code></div><img src="assets/hardware-ed25519/step-04-browser-a-cid-visible.png" alt="Hardware Ed25519 Step 4" /></div>
            <div class="step"><div class="label"><code>step-05-browser-b-ipfs-download-success.png</code></div><img src="assets/hardware-ed25519/step-05-browser-b-ipfs-download-success.png" alt="Hardware Ed25519 Step 5" /></div>

            <h2>Hardware P-256</h2>
            <div class="step"><div class="label"><code>step-01-browser-a-did-created.png</code></div><img src="assets/hardware-p256/step-01-browser-a-did-created.png" alt="Hardware P-256 Step 1" /></div>
            <div class="step"><div class="label"><code>step-02-browser-a-delegation-imported.png</code></div><img src="assets/hardware-p256/step-02-browser-a-delegation-imported.png" alt="Hardware P-256 Step 2" /></div>
            <div class="step"><div class="label"><code>step-03-browser-a-upload-complete.png</code></div><img src="assets/hardware-p256/step-03-browser-a-upload-complete.png" alt="Hardware P-256 Step 3" /></div>
            <div class="step"><div class="label"><code>step-04-browser-a-cid-visible.png</code></div><img src="assets/hardware-p256/step-04-browser-a-cid-visible.png" alt="Hardware P-256 Step 4" /></div>
            <div class="step"><div class="label"><code>step-05-browser-b-ipfs-download-success.png</code></div><img src="assets/hardware-p256/step-05-browser-b-ipfs-download-success.png" alt="Hardware P-256 Step 5" /></div>
          </body>
          </html>
          HTML

          # Keep delegation path reachable even if this workflow is the latest deploy.
          mkdir -p site/delegation-flow
          cat > site/delegation-flow/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Delegation Flow</title>
          </head>
          <body style="font-family:sans-serif;margin:24px;background:#f8fafc;color:#111827;">
            <a href="../">← Back to all flows</a>
            <h1>Delegation Flow</h1>
            <p>This page is generated by the Delegation workflow deployment.</p>
            <p>Workflow: <a href="https://github.com/NiKrause/ucan-upload-wall/actions/workflows/delegation-flow.yml">Delegation Flow</a></p>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ipfs-network-flow-pages
          path: site

  deploy-ipfs-network-pages:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: publish-ipfs-network-artifacts
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ipfs-network-flow-pages
