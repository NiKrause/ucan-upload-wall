        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Revocation Flow E2E (Hardware Ed25519)
        run: npx playwright test tests/revocation-flow.spec.ts --project=chromium --grep "Hardware Ed25519"

      - name: Upload test results
        if: failure()
