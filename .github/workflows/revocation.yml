  revocation-flow-hardware-p256:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      TEST_HARDWARE_P256: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Revocation Flow E2E (Hardware P-256)
        run: npx playwright test tests/revocation-flow.spec.ts --project=chromium --grep "Hardware P-256 \(Fallback\)"

      - name: Upload test results
        if: failure()
