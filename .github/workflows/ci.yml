name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # disable type check for now until we have a way to fix the errors
      # - name: Run TypeScript type check
      #   run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

      - name: Build project
        run: npm run build

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Delegation Flow E2E (Worker Fallback)
        run: npx playwright test tests/delegation-upload-flow.spec.ts --project=chromium --grep "Worker Fallback \(Forced\)"

      - name: Run Delegation Flow E2E (Hardware Ed25519)
        run: npx playwright test tests/delegation-upload-flow.spec.ts --project=chromium --grep "Hardware Ed25519"

      - name: Run Delegation Flow E2E (Hardware P-256)
        env:
          TEST_HARDWARE_P256: "1"
        run: npx playwright test tests/delegation-upload-flow.spec.ts --project=chromium --grep "Hardware P-256 \(Fallback\)"

      # - name: Run E2E tests
      #   run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
